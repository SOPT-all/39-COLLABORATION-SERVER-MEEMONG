services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: meemong
      MYSQL_USER: meemong
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    volumes:
      - meemong-db:/var/lib/mysql

volumes:
  meemong-db: